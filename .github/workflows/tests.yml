name: Run Unit Tests (PR)

on:
  pull_request:
    branches: [ master, develop ]
  push:
    branches: [ master ]  # utile pour voir l'état des tests sur master après merge

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.11 • Ubuntu
    runs-on: ubuntu-latest
    env:
      # ✅ Ajout clé : rendre le dossier racine importable → "src" devient visible
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner disk space (before)
        run: |
          echo "Espace disque avant install :"
          df -h

      - name: Install system audio deps (ffmpeg, sox, libsndfile)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg sox libsndfile1
          ffmpeg -version | head -n 1
          sox --version | head -n 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 🧰 Cache uv + venv pour accélérer les CI suivantes
      - name: Cache uv + venv
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: uv-${{ runner.os }}-py311-${{ hashFiles('pyproject.toml', 'uv.lock', 'poetry.lock', 'requirements.txt') }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      
      - name: Create venv (Python 3.11)
        run: |
          uv venv --python 3.11 .venv

      # 💡 Adapte les "extras" aux tiens. Ici on suppose que:
      # - "dev" contient pytest et les outils de test
      # On reste CPU-only sur le runner CI.
      - name: Resolve & install dependencies with uv (CPU)
        env:
          # Force CPU pour torch/torchaudio si tu utilises ces libs
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          # Si tu utilises uv.lock, garde --frozen. Sinon retire-le.
          uv sync --frozen --extra dev --python .venv/bin/python \
            --no-install-package faster-whisper \
            --no-install-package av

      - name: Print environment
        run: |
          . .venv/bin/activate
          python -V
          pip list

      # ✅ On exécute l'ensemble des tests présents dans le dossier tests
      - name: Run unit tests (pytest)
        run: |
          . .venv/bin/activate
          pytest tests \
            -q --maxfail=1 --disable-warnings \
            --junitxml=reports/junit.xml \
            --durations=20

      - name: Run transformer text backend gates (if present)
        run: |
          . .venv/bin/activate
          for gate in \
            tests/acceptance/run_transformer_text_backend_gate.sh \
            tests/acceptance/run_non_goal_format_regression_gate.sh; do
            if [ -f "$gate" ]; then
              echo "Running $gate"
              bash "$gate"
            else
              echo "Skipping missing gate: $gate"
            fi
          done

      # 📦 Artefacts utiles en cas d'échec (logs, rapports pytest, etc.)
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports
          path: |
            reports/junit.xml
            .pytest_cache/**/*
          if-no-files-found: ignore

      - name: Show runner disk space (after)
        if: always()
        run: |
          echo "Espace disque après tests :"
          df -h
