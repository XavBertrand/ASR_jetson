[pytest]
testpaths = tests
pythonpath = src
addopts = --rootdir=.
markers =
    unit: fast unit tests
    integration: integration tests
    contract: contract-level compatibility checks
    perf: performance regression checks
    non_goal_format: regression checks protecting unchanged PDF/DOCX/XLSX behavior
    gpu: tests requiring GPU
    slow: marks tests that require heavy models or external services (deselect with '-m \"not slow\"')
